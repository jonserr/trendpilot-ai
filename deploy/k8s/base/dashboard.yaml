apiVersion: apps/v1
kind: Deployment
metadata:
  name: trendpilot-dashboard
  labels:
    app.kubernetes.io/name: trendpilot-dashboard
    app.kubernetes.io/component: dashboard
spec:
  # Model Training page runs training in-process. Keep one replica.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: trendpilot-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trendpilot-dashboard
        app.kubernetes.io/component: dashboard
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Co-locates with API pod so ReadWriteOnce volume attaches to one node
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: trendpilot-api
              topologyKey: kubernetes.io/hostname
      containers:
        - name: dashboard
          image: trendpilot-dashboard
          ports:
            - name: http
              containerPort: 8501
          envFrom:
            - configMapRef:
                name: trendpilot-config
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              memory: 3Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: storage
              mountPath: /app/data/raw
              subPath: raw
            - name: storage
              mountPath: /app/data/processed
              subPath: processed
            - name: storage
              mountPath: /app/models
              subPath: models
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: trendpilot-storage
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: trendpilot-dashboard
  labels:
    app.kubernetes.io/name: trendpilot-dashboard
    app.kubernetes.io/component: dashboard
spec:
  selector:
    app.kubernetes.io/name: trendpilot-dashboard
  ports:
    - name: http
      port: 8501
      targetPort: http
