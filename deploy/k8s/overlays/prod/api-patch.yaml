apiVersion: apps/v1
kind: Deployment
metadata:
  name: trendpilot-api
spec:
  replicas: 2
  template:
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: trendpilot-api
      containers:
        - name: api
          # Kubernetes requires the key; the app also rejects an empty value.
          env:
            - name: API_KEY_REQUIRED
              value: "true"
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: trendpilot-secrets
                  key: API_KEY
                  optional: false
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 2Gi
