apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: dashboard-auth
spec:
  basicAuth:
    # Secret must contain key "users" with bcrypt htpasswd entries.
    secret: trendpilot-dashboard-auth
    realm: Trendpilot
    removeHeader: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-redirect
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: strict-tls
spec:
  minVersion: VersionTLS12
  # Reject unmatched/missing SNI instead of serving Traefik's fallback certificate.
  sniStrict: true
