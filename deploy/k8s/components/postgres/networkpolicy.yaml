# Restricts database ingress to API pods. Enforced only on CNIs with NetworkPolicy support.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trendpilot-postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: trendpilot-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: trendpilot-api
      ports:
        - protocol: TCP
          port: 5432
