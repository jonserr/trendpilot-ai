# Credentials come from Secret trendpilot-postgres (keys POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB).
# Including overlay generates or supplies that Secret.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: trendpilot-postgres
  labels:
    app.kubernetes.io/name: trendpilot-postgres
    app.kubernetes.io/component: database
spec:
  serviceName: trendpilot-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trendpilot-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trendpilot-postgres
        app.kubernetes.io/component: database
    spec:
      securityContext:
        runAsNonRoot: true
        # UID of postgres user in postgres alpine image
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: trendpilot-postgres
          env:
            # Subdirectory avoids lost+found conflict on fresh volumes
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: trendpilot-postgres
  labels:
    app.kubernetes.io/name: trendpilot-postgres
    app.kubernetes.io/component: database
spec:
  selector:
    app.kubernetes.io/name: trendpilot-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
