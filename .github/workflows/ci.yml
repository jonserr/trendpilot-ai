name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TF_NUM_INTRAOP_THREADS: '1'
      TF_NUM_INTEROP_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.8'
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-extras

      - name: Check Python source and scripts
        run: |
          uv run --no-sync ruff check src api app tests scripts
          uv run --no-sync black --check src api app tests scripts

      - name: Run offline tests
        run: uv run --no-sync pytest

      - name: Check rendered Kubernetes overlays
        run: |
          kubectl version --client
          uv run --no-sync python scripts/check_deployments.py --environment dev
          uv run --no-sync python scripts/check_deployments.py --environment prod

  docker-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Compose configuration
        run: docker compose config --quiet

      - name: Build API image
        run: docker build -f Dockerfile.api -t trendpilot-api:dev .

      - name: Build dashboard image
        run: docker build -f Dockerfile.dashboard -t trendpilot-dashboard:dev .

      - name: Check ingress behavior
        run: python3 scripts/smoke_ingress.py --app-image trendpilot-api:dev
